<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff0d8">
  <title>购物车飞出去了！</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div><h1>购物车飞出去了！</h1><p id="area">黑五停车场 · 无尽连跳</p></div></div>
      <button id="mute" class="icon" type="button" aria-label="静音" aria-pressed="false">♫</button>
    </header>
    <section id="stage" class="stage" aria-label="3D 购物车连跳">
      <div id="scene"></div>
      <div class="hud">
        <div class="cash"><span>返现</span><b id="score">¥0</b><small id="best"></small></div>
        <div class="hud-right">
          <div class="chip"><b id="dist">0</b> 米</div>
          <div class="chip pile"><i></i>车里 <b id="pile">1</b> 件</div>
        </div>
      </div>
      <div id="flips" class="flips" hidden><b>×2</b><span>后空翻</span></div>
      <div id="wind" class="wind" hidden></div>
      <div id="floaters" class="floaters" aria-live="polite"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="hint" class="hint" hidden></div>
    </section>
    <section class="controls">
      <button id="hold" class="hold" type="button"><span class="hold-ic" aria-hidden="true">↺</span><span id="hold-label">按住 · 后空翻</span></button>
    </section>

    <div id="start" class="overlay">
      <section class="card" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <div class="tag">黑五停车场 · 无尽连跳</div>
        <h2 id="start-title">购物车飞出去了！</h2>
        <div class="rules">
          <div><i class="r-ic spin"></i><span><b>按住 = 后空翻</b>，松手车头会往下栽</span></div>
          <div><i class="r-ic wheel"></i><span>轮子朝下落地才算数，越平越好，<b>完美落地</b>翻倍还加速</span></div>
          <div><i class="r-ic pile"></i><span>路过闪购货架会往车里塞货，<b>翻一圈倍率 +1</b>，货越多返现越多</span></div>
        </div>
        <p id="start-best" class="meta"></p>
        <button id="go" class="primary go" type="button">开推！</button>
      </section>
    </div>

    <div id="result" class="overlay" hidden>
      <section class="receipt" role="dialog" aria-modal="true" aria-label="返现小票">
        <div class="receipt-lines" id="receipt-lines"></div>
        <div class="stamp" id="stamp" hidden><span id="stamp-title"></span><small id="stamp-sub"></small></div>
        <p class="result-note" id="result-note"></p>
        <button id="retry" class="primary retry" type="button" hidden>再推一车</button>
      </section>
    </div>
  </main>
  <script type="module" src="game.mjs"></script>
</body>
</html>
