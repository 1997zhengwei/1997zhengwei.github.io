<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#91acde"><title>奶油派对 · Frost & Feast</title><link rel="stylesheet" href="./src/style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main id="game" class="home" aria-label="奶油派对 3D 蛋糕装饰游戏">
 <div id="stage"><canvas id="scene" aria-label="可以旋转裱花和抹平的立体蛋糕"></canvas><div id="sparkles" aria-hidden="true"></div><div id="gesture" aria-hidden="true"><span class="finger"><svg viewBox="0 0 40 48" aria-hidden="true"><path d="M13 28V10c0-5 7-5 7 0v13c0-5 6-5 6 0v2c1-4 6-3 6 1v2c3-3 6-1 6 3l-2 9c-1 4-4 6-8 6h-8c-4 0-6-3-8-6L4 29c-3-4 2-8 5-5l4 4Z" fill="#fff" stroke="#365779" stroke-width="2.1" stroke-linejoin="round"/><path d="M20 18v12m6-7v8m6-5v7" fill="none" stroke="#b6c5d4" stroke-width="1.5" stroke-linecap="round"/></svg></span><span id="gesture-text">按住，上下滑动</span></div></div>
 <nav id="edge-tools"><button id="undo" class="edge" aria-label="撤销上一次操作" title="撤销"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H15a5 5 0 0 1 0 10H8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 3 5 7l4.5 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="settings" class="edge" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8a7 7 0 0 1 0 1.9l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8a7 7 0 0 1 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9Z" transform="translate(0 1.5)"/><circle cx="12" cy="13.5" r="3.2" fill="var(--bar)"/></svg></button></nav>
 <section id="home-header"><span class="eyebrow">A LITTLE ICING, A LOT OF JOY</span><h1>Frost <i>&</i> Feast</h1><div class="cn-title">奶油派对</div><span class="home-caption">把秋天，裱进一份甜蜜里。</span></section>
 <header id="play-header" hidden><div id="order-label">第 1 份</div><div class="rating-stars" aria-hidden="true"><span>★</span> <span>★</span> <span>★</span></div><div class="progress-track"><i id="progress-fill"></i></div><h2 id="phase-title">挤上奶油</h2><p id="phase-hint">按住并上下滑动</p></header>
 <button id="target" aria-label="查看目标蛋糕" hidden><span>目标</span><img id="target-img" alt="目标蛋糕的奶油配色"></button>
 <div id="floating-hint" role="status"></div>
 <footer id="home-footer"><div id="home-order">今日甜点 · 丰收三重奏</div><button id="start" class="big mint">开始装饰 <span class="ic go"></span></button><div class="home-links"><button id="orders"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h9.5a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 7.5h5.5M7 10.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>订单簿</button><button id="free"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5 16.5 6.5 9 14l-3.2.2.2-3.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 16.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>自由创作</button><button id="gallery"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m5.5 13.5 3.2-3.5 2.3 2.3 1.6-1.6 2 2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="13" cy="7.5" r="1.2" fill="currentColor"/></svg>我的作品 <b id="gallery-count">0</b></button></div><div class="wallet"><i></i><span id="home-coins">0</span><small>颗甜蜜金币</small></div></footer>
 <footer id="work-footer" hidden><div class="work-toolbar"><div id="surface-tabs"><button class="selected" data-surface="side"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 8h13M3.5 12h13" stroke="currentColor" stroke-width="1.6"/></svg>侧面</button><button data-surface="top"><svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="7" ry="5" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="10" cy="10" rx="2.6" ry="1.8" fill="currentColor"/></svg>顶部</button></div><span id="coverage">覆盖 0%</span></div><div id="palette" aria-label="选择奶油颜色"></div><div id="toppings" aria-label="选择点缀" hidden></div><div id="action-row"><button id="back-step" class="small-action" hidden>返回裱花</button><button id="next-step" class="big mint">开始抹平 <span class="ic go"></span></button></div></footer>
 <section id="result" class="overlay" hidden><div class="result-card"><span class="eyebrow" id="result-eyebrow">A LITTLE MASTERPIECE</span><h2 id="result-title">甜蜜完成！</h2><div class="match"><b id="result-score">95</b><span>%</span></div><div id="result-stars" class="result-stars" aria-label="本次星级">★★★</div><p id="result-copy"></p><div class="result-metrics"><span>覆盖<b id="metric-coverage"></b></span><span>配色<b id="metric-match"></b></span><span>平滑<b id="metric-smooth"></b></span></div><div class="result-reward"><i></i><b id="reward">+36</b><span>已收藏到「我的作品」</span></div><button id="next-order" class="big mint">下一份甜点 <span class="ic go"></span></button><div class="result-links"><button id="retry">再做一次</button><button id="result-home">回到首页</button></div></div></section>
 <section id="modal" class="overlay" hidden><div class="modal-card"><button id="close-modal" aria-label="关闭弹窗">×</button><div id="modal-content"></div></div></section>
 <div id="loading"><div class="loading-dot"></div><b>一份甜蜜，马上开始</b><small>正在准备旋转台…</small></div>
</main><script type="module" src="./src/app.mjs"></script></body></html>
