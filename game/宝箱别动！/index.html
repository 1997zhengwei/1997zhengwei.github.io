<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#273447"><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><title>宝箱别动！</title></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m2 5 6-2 8 3 6-2v15l-6 2-8-3-6 2zM8 3v15m8-12v15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d39331" stroke="#784d35" stroke-width="1.2"/><circle cx="11" cy="10.5" r="8.5" fill="#ffdb76"/><path d="m11 4 4.8 6.5-4.8 6-4.7-6z" fill="#e59a35"/><path d="m11 4 .2 7-4.9-.5z" fill="#fff3ac"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M7 12V7a1.5 1.5 0 0 1 3 0v4-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v7c0 4-2.1 6-5.5 6h-1.1c-2 0-3.2-.7-4.4-2.4l-4.1-5.5c-1.2-1.8.7-3.3 2-2.1L8 14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="m3 8 9-4 9 4-9 4zM3 8v10l9 4 9-4V8M12 12v10M8 6l9 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M7 3h10l-3 5c4.9 3.7 7 6.8 6 10.6C19 22 5 22 4 18.6 3 15 5.5 11.1 10 8z" fill="currentColor"/><path d="M8 9h8m-4 3v6m-2-4h4" fill="none" stroke="#283c45" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M18.8 15A8.8 8.8 0 0 1 9 4.2 8.6 8.6 0 1 0 19.8 15z" fill="currentColor"/><path d="m16 3 .8 2.4L19 6l-2.2.8L16 9l-.8-2.2L13 6l2.2-.6z" fill="currentColor"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 10h4l5-4v12l-5-4H3zm12-1c2 1.7 2 4.3 0 6m3-9c4 3.1 4 8.9 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5" fill="currentColor"/><rect x="2" y="8" width="20" height="3" fill="#14435a"/><rect x="5" y="13" width="5" height="3.5" rx=".6" fill="#ffd24a"/></symbol>
<symbol id="i-gem" viewBox="0 0 24 24"><path d="m2 9 4-5h12l4 5-10 12z" fill="currentColor"/><path d="m2 9 20 0m-10 12-5-12 3-5m2 17 5-12-3-5" fill="none" stroke="#ffffffac" stroke-width="1.3"/></symbol>
</defs></svg>
<main id="app">
<canvas id="world" tabindex="0" aria-label="拖动移动，松手藏箱。也可以用方向键或 WASD 移动。"></canvas>
<header class="hud">
  <button id="map" aria-label="打开藏宝地图"><svg id="radar" aria-hidden="true"></svg><span id="zoneName"></span></button>
  <div class="room"><div class="chapter"><span id="chapter">第 01 夜</span><span class="sep">/</span><h1 id="place">黄金展厅</h1></div>
  <div class="track" aria-label="本局藏品"><div id="slots"></div><b id="score">0 / 3</b></div>
  <div class="clock" id="clock"><span id="timer">0:00</span><small id="par">★ 1:00</small></div></div>
  <span class="wallet" title="已带回的金币"><svg><use href="#i-coin"/></svg><b id="cash">0</b></span>
</header>
<div id="alarmWash" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div><div id="bubbles" aria-hidden="true"></div>
<div id="alert" hidden><b>!</b><span><i></i></span></div>
<div id="tag" hidden></div><div id="entry" aria-hidden="true"></div><div id="joy" hidden><i></i></div>
<button id="decoy" type="button" hidden aria-label="扔出诱饵金币"><svg><use href="#i-coin"/></svg><b id="decoyCount">0</b><small>诱饵</small></button>
<section class="bottom">
  <div id="notice" aria-live="polite"></div>
  <div class="guide" id="guide"><p class="nightcard"><b id="nightTitle"></b><span id="nightTip"></span></p><div class="gesture"><span><svg><use href="#i-hand"/></svg>拖动移动</span><i></i><span><svg><use href="#i-box"/></svg>松手藏箱</span></div></div>
</section>
<dialog id="panel"><div class="sheet"><button class="close" id="close" aria-label="关闭">×</button><div class="sheetmark"><svg><use href="#i-map"/></svg></div><h2 id="panelTitle">藏宝地图</h2><p id="panelSub"></p><div id="atlas" hidden><svg id="atlasPlan" aria-label="当前关卡的房间、通道与藏品区域"></svg><div class="legend"><span>● 你</span><span>◆ 宝物区域</span><span>▬ 接应车</span></div></div><div id="choices"></div><div id="outcome"></div><footer id="panelButtons"></footer></div></dialog>
<p id="error" hidden>无法加载 3D 场景。请使用支持 WebGL 的浏览器。</p>
</main><script type="module" src="./game.js"></script></body></html>
