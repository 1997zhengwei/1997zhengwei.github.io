<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e8"><title>Bubble Roll: Endless Tide</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>BIKINI BOTTOM · EXPLORATION SURVIVAL</small><h1>Bubble Roll <em>Endless Tide</em></h1></div><button id="sound" aria-label="Enable sound">♪</button><button id="pause" aria-label="Pause game">Ⅱ</button></header>
<section class="hud"><div class="topline"><strong id="street">STREET 1 · CONCH STREET</strong><b id="clock">0:00</b></div><div id="healthBox"><div class="health-label"><strong>♥ HEALTH <b id="healthNumber">100 / 100</b></strong><span id="healthHint">Stay alive. Keep exploring.</span></div><div id="health" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="healthTrail"></i><i id="healthFill"></i></div></div><div class="goal"><span id="goal">Explore · find 3 supply caches</span><b id="mass">SIZE 10</b></div><div class="xp"><i id="xp"></i></div><div class="stats"><span id="level">LEVEL 1</span><span id="loadout">Roll small loot to grow</span><span id="score">0 PTS</span></div><div id="bossPanel" hidden><div><strong id="bossName"></strong><b id="bossHP"></b></div><div class="boss-track"><i id="bossFill"></i></div><small id="bossHint"></small></div></section>
<main id="world"><canvas id="map" width="160" height="160" aria-label="Street map: white is you, gold marks supply caches, green marks medical supplies and the boss beacon"></canvas><div id="damageShade"></div><div id="damageNumber"></div><div id="layoutName"></div><button id="challenge" hidden>Call boss</button><div id="toast" role="status"></div><div id="guide"></div><div id="growth" aria-label="Bubble diameter compared with starting size">BUBBLE 1.0×</div><div id="enemyTip"></div><div id="overlay"><article id="card"><small id="tag"></small><h2 id="title"></h2><p id="description"></p><div id="details"></div><div id="choices"></div><button id="primary">Let's roll</button><button id="secondary" hidden>New run</button></article></div></main>
<footer><div id="stick" aria-label="Movement joystick"><span id="knob"></span><small>MOVE</small></div><div class="actions"><button id="dash"><strong>Dash</strong><small>READY · SPACE</small></button><button id="power"><strong>Power</strong><small>UNLOCK AT LEVEL 2</small></button></div><button id="swap" hidden aria-label="Switch active power">⇄</button></footer><div class="legend"><span class="green">● ROLL</span><span class="gold">● DASH</span><span class="red">● DODGE</span><small>WASD / stick · Space dash · E power</small></div>
<script type="module" src="app.mjs"></script></body></html>
