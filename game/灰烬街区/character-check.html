<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色步态检查</title><style>body{margin:0;background:#29392d;color:#ddd;font:14px system-ui}canvas{display:block}nav{position:absolute;top:15px;left:15px;display:flex;gap:8px}button{padding:13px;background:#536b4f;color:#eee;border:1px solid #899a77}output{position:absolute;bottom:16px;left:16px}</style><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script><nav><button data-clip="Idle">站立</button><button data-clip="Walk">行走</button><button data-clip="Run">奔跑</button><button id="attack">攻击</button><button id="freeze-attack">攻击定格</button><button id="pause">暂停动作</button><button id="turn">转身45°</button></nav><output>加载中</output><script type="module">
import * as T from 'three';import {attachHeldTool,toolSwing,resetToolSwing} from './held-tool.mjs';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const s=new T.Scene();s.background=new T.Color('#344738');const c=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);c.position.set(4,2.8,5);c.lookAt(0,1,0);s.add(new T.HemisphereLight(0xd9e6ed,0x4c4e35,2.5));const l=new T.DirectionalLight(0xffe9b1,3);l.position.set(3,6,5);s.add(l);const grid=new T.GridHelper(14,28,0x93a084,0x54674e);s.add(grid);const g=await new GLTFLoader().loadAsync('./assets/characters/survivorMaleB.glb?v=02');const root=new T.Group();root.add(g.scene);const b=new T.Box3().setFromObject(g.scene),k=2.08/b.getSize(new T.Vector3()).y;root.scale.setScalar(k);root.position.y=-b.min.y*k;s.add(root);const axe=await new GLTFLoader().loadAsync('./assets/survival-kit/tool-axe.glb'),held=attachHeldTool(g.scene,axe.scene,k);const m=new T.AnimationMixer(g.scene);let a=m.clipAction(g.animations.find(a=>a.name==='Idle'));a.play();let paused=false,cool=0;document.querySelector('#attack').onclick=()=>{paused=false;cool=.65;};document.querySelector('#freeze-attack').onclick=()=>{paused=true;cool=.325;};document.querySelectorAll('[data-clip]').forEach(btn=>btn.onclick=()=>{a.stop();a=m.clipAction(g.animations.find(a=>a.name===btn.dataset.clip));a.reset().play();cool=0;paused=false;});document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#turn').onclick=()=>root.rotation.y+=Math.PI/4;let prev=performance.now();function frame(t){let dt=Math.min(.05,(t-prev)/1000);prev=t;resetToolSwing(g.scene);m.update(paused?0:dt);if(!paused)cool=Math.max(0,cool-dt);toolSwing(g.scene,cool);g.scene.getObjectByName('Head')?.scale.set(.78,.78,.78);document.querySelector('output').textContent=a.getClip().name+' · '+a.time.toFixed(2)+'s · '+(cool>0?'挥动':'握持')+' · 掌心绑定';r.render(s,c);requestAnimationFrame(frame)}requestAnimationFrame(frame);addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix()});</script></html>
