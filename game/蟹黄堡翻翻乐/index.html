<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Krabby Patty Flip</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><small>BIKINI BOTTOM • LUNCH SHIFT</small><h1>Krabby Patty Flip</h1></div><button id="pause" aria-label="Pause game">Ⅱ</button></header>
<section class="hud"><span id="orders">0 / 3 served</span><span id="score">0 points</span><span id="lives" aria-label="3 chances left">♥ ♥ ♥</span></section>
<div class="stage"><canvas id="scene" width="600" height="450" aria-label="Kitchen: flip the patty from the griddle onto the waiting bun"></canvas><div id="overlay" hidden><small id="overline">SHIFT COMPLETE</small><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">Another shift</button></div></div>
<section class="controls"><div id="message" role="status">Hold to aim. Release in the green zone!</div><div class="meter" aria-label="Flip power"><div id="zone"></div><div id="power"></div><i id="needle"></i></div><div class="meter-labels"><span>SHORT</span><b id="charge">0%</b><span>FAR</span></div><button id="flip">HOLD TO FLIP <span>or hold SPACE</span></button><p class="hint">Serve 3 burgers. The dotted arc shows your landing.</p><button id="sound" class="quiet" aria-pressed="false">Sound: off</button></section>
<footer>Made with illustrated PNG props · Code-first prototype</footer></main><script src="rules.js"></script><script src="game.js"></script></body></html>
