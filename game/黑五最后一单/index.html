<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e5f4f2">
  <title>黑五最后一单</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>黑五最后一单</h1><p id="shift">无尽营业 · 黑五夜</p></div></div>
      <button id="mute" class="icon" type="button" aria-label="静音" aria-pressed="false">♫</button>
    </header>
    <div class="stage" id="stage" aria-label="3D 收银台">
      <div id="scene"></div>
      <div class="hud">
        <div class="gmv-box" id="gmv-box">
          <span>今日成交额</span><b id="gmv">¥0</b><small id="best"></small>
          <div class="fever-meter" id="fever-meter"><i id="fever-fill"></i><span id="fever-label">爆单槽</span></div>
        </div>
        <div class="hud-right">
          <div class="strikes" id="strikes" aria-label="差评"><i></i><i></i><i></i></div>
          <div class="combo" id="combo" hidden><b>×3</b><span>连扫</span></div>
        </div>
      </div>
      <div class="chips"><span class="queue-chip" id="queue-chip"></span><span class="level-chip" id="level"></span></div>
      <button class="sticker" id="sticker" type="button" hidden aria-label="撕黑五贴纸"><span>黑五价</span><b>−¥10</b></button>
      <div class="floaters" id="floaters" aria-live="polite"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="stage-hint" id="guide" hidden></div>
    </div>
    <section class="console" aria-label="收银操作">
      <div class="patron">
        <b id="customer"></b>
        <div class="patience" aria-label="顾客耐心"><i id="patience"></i></div>
        <span id="mood" class="mood"></span>
        <b id="subtotal" class="subtotal">¥0</b>
      </div>
      <div id="scan-panel" class="action-card">
        <div class="product"><small id="product-step"></small><b id="product-name"></b><span id="product-price"></span></div>
        <button id="turn-left" class="turn" type="button" aria-label="向左转">↺</button>
        <button id="turn-right" class="turn" type="button" aria-label="向右转">↻</button>
        <button id="scan" class="primary scan" type="button"><span class="scan-icon" aria-hidden="true"></span>扫码</button>
      </div>
      <div id="idle-panel" class="action-card idle" hidden><span>店里暂时没人，下一位马上到…</span></div>
      <div id="payment" class="payment" hidden>
        <div class="payment-head"><b id="pay-title"></b><span id="pay-detail"></span></div>
        <div id="pay-options" class="pay-options"></div>
      </div>
    </section>

    <div id="start" class="overlay">
      <section class="card start-card" role="dialog" aria-modal="true" aria-labelledby="start-title">
        <div class="tag">无尽营业</div>
        <h2 id="start-title">黑五最后一单</h2>
        <p class="intro">顾客源源不断，越来越多、越来越急。能卖多少是多少！</p>
        <div class="rules">
          <div><i class="r-ic beam"></i><span>看 3D 商品找条码：朝你就拖过红线，在侧面就点那一边转过来</span></div>
          <div><i class="r-ic star"></i><span>黄色黑五贴纸先点掉，漏了多收钱顾客会炸毛</span></div>
          <div><i class="r-ic fire"></i><span>连扫攒满爆单槽 → 爆单时间：条码全朝你，狂拖就完事</span></div>
          <div><i class="r-ic face"></i><span>顾客等不及就走人，3 个差评打烊；成交额破关口店长会帮你抵消差评</span></div>
        </div>
        <p id="start-best" class="meta"></p>
        <button id="go" class="primary go" type="button">开门营业</button>
      </section>
    </div>

    <div id="result" class="overlay" hidden>
      <section class="receipt" role="dialog" aria-modal="true" aria-label="今晚小票">
        <div class="receipt-lines" id="receipt-lines"></div>
        <div class="stamp" id="stamp" hidden><span id="stamp-title"></span><small id="stamp-sub"></small></div>
        <p class="result-note" id="result-note"></p>
        <div class="result-actions" id="result-actions" hidden>
          <button id="retry" class="primary" type="button">再开一晚</button>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="game.mjs"></script>
</body>
</html>
