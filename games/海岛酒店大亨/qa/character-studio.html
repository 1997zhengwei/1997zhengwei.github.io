<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24位海岛旅客 · 角色美术检视</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6f6fa;color:#17455d;font:15px 'Microsoft YaHei',sans-serif}header{padding:24px 4vw;background:#fff;position:sticky;top:0;z-index:1;box-shadow:0 4px 20px #235c7810}h1{margin:0 0 7px;font-size:25px}p{margin:0;color:#63899a;font-size:12px}.switches{display:flex;gap:8px;margin-top:16px}button{border:0;border-radius:10px;padding:10px 20px;background:#e5f0f6;color:#31708d;font-weight:700;cursor:pointer}button.selected{background:#15a4b5;color:white}main{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;padding:24px 4vw}article{border:2px solid white;border-radius:22px;background:linear-gradient(150deg,#fff8e5,#d7f0f2);box-shadow:0 5px 15px #366f8a0d;text-align:center;padding:8px 0 16px}img{display:block;width:100%;aspect-ratio:210/270;object-fit:contain}b{font-size:13px}small{display:block;font-size:9px;color:#698c98;margin-top:5px}@media(max-width:700px){main{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px}header{padding:16px}h1{font-size:19px}b{font-size:10px}}</style>
<header><h1>24位海岛旅客</h1><p>游戏内旅客形象预览 · 同款3D模型 · 不影响经营进度</p><div class="switches"><button data-angle="0" class="selected">正面</button><button data-angle="3.14159">背面</button><button data-angle="0.65" data-pose="walk">行走姿态</button></div></header><main></main>
<script type="module">
import {GUEST_LOOKS} from '../src/guest-looks.mjs';import {renderGuestCard} from '../src/characters.mjs';
const main=document.querySelector('main');
const wardrobe={shirt:'度假衬衫',dress:'裙装',suit:'精致套装',jacket:'休闲外套',tee:'轻便短袖',hoodie:'运动卫衣',overalls:'背带裤'},bags={duffel:'旅行包',tote:'托特包',briefcase:'公文包',roller:'拉杆箱',backpack:'背包',handbag:'手提包'};
function render(angle=0,pose='idle'){main.innerHTML=GUEST_LOOKS.map(p=>`<article><img src="${renderGuestCard(p.id,angle,pose)}" alt="${p.name}完整三维形象"><b>${String(p.id+1).padStart(2,'0')} ${p.name}</b><small>${wardrobe[p.shape]} · ${bags[p.bag]}</small></article>`).join('');}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('.selected').classList.remove('selected');b.classList.add('selected');render(Number(b.dataset.angle),b.dataset.pose||'idle');});render();
</script></html>
