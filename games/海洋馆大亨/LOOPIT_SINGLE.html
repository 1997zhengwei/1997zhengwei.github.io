    cam.left = -h * 360 / 220;
    cam.right = h * 360 / 220;
    cam.top = h;
    cam.bottom = -h;
    cam.updateProjectionMatrix();
    renderer.render(preview, cam);
    ui.thumbs[d.id + (d.rare ? ":rare" : "")] = renderer.domElement.toDataURL("image/png");
    preview.remove(o);
    g.dispose();
    m.dispose();
  }
  renderer.setPixelRatio(ratio);
  resize();
}
await document.fonts.ready;
makeFishThumbnails();
resize();
ui.update();
map();
if (started) {
  document.body.classList.add("started");
  $2("welcome").hidden = true;
  focus.set(sim.player.x, 0, sim.player.z - 3);

requestAnimationFrame(animate);
console.info("Aqua Coast " + VERSION + " \xB7 local 3D aquarium ready");
