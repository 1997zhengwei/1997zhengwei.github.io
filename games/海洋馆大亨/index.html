<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#50bfc9"><title>海洋馆大亨 · 蔚蓝海岸</title><link rel="stylesheet" href="./src/style.css"></head><body>
<main id="game" aria-label="海洋馆大亨三维游戏"><canvas id="scene" aria-label="可以行走、潜水与捕鱼的海洋馆"></canvas>
<header id="hud"><button id="brand" class="brand card" aria-label="查看馆长荣誉"><span class="brand-icon" id="brand-icon"></span><div><h1>蔚蓝海岸</h1><small id="rank">海边小鱼馆</small></div></button><button id="wealth" class="wallet card" aria-label="查看财富金库"><span id="coin-icon"></span><div><strong id="cash">120</strong><small>贝壳金币</small></div></button></header>
<button id="quest" class="card" aria-label="查看成长目标"></button>
<div id="water-info" hidden><span id="zone-name">珊瑚浅湾</span><div class="oxygen"><span id="oxygen-fill"></span></div><small id="oxygen-text">氧气 60s</small></div>
<aside id="utility"><button id="sound" class="round" aria-label="关闭声音"></button><button id="help" class="round" aria-label="玩法说明"></button><button id="pause" class="round" aria-label="暂停"></button></aside>
<button id="minimap" class="card" aria-label="打开海域地图"><canvas id="map" width="144" height="176"></canvas><span>海域图</span></button>
<div id="world-labels"></div><div id="target-ring" hidden><svg viewBox="0 0 60 60"><circle class="track" cx="30" cy="30" r="25"/><circle id="capture-progress" cx="30" cy="30" r="25"/></svg><span id="capture-name"></span></div>
<div id="guide" class="card"><span id="guide-icon"></span><div><strong id="guide-title">到码头，开始第一次潜水</strong><small id="guide-text">拖动移动 · 靠近鱼群自动捕鱼</small></div></div>
<div id="cargo" class="card"><span id="bag-icon"></span><strong id="bag-count">0 / 10</strong><span id="bag-types">网兜空空，去海里看看</span></div>
<div id="joystick" aria-label="拖动摇杆移动"><div id="stick"></div></div>
<div id="actions"><button id="return" class="round" aria-label="回馆补货" hidden></button><button id="cast" class="primary"><span id="cast-icon"></span><strong id="cast-text">下海捕鱼</strong></button></div>
<nav id="bottom" aria-label="经营菜单"><button data-menu="upgrades"><span id="upgrade-icon"></span><strong>装备 · 员工</strong></button><button data-menu="tanks"><span id="tank-icon"></span><strong>扩建展馆</strong></button><button data-menu="album"><span id="album-icon"></span><strong>海洋图鉴</strong></button></nav>
<aside id="honor" class="card" role="status" hidden><div class="honor-rays"></div><span class="honor-crown">♛</span><small id="honor-kicker"></small><strong id="honor-name"></strong><span id="honor-detail"></span><button id="honor-close" aria-label="关闭庆典">×</button><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><i class="confetti c5"></i><i class="confetti c6"></i></aside><div id="toast" role="status"></div><div id="floaters"></div><div id="discovery" class="card" hidden></div>
<section id="welcome" class="card"><span class="eyebrow">YOUR LITTLE OCEAN EMPIRE</span><h2>把一片海，<br>装进你的海洋馆。</h2><p>潜入碧海，捕获第一网小鱼。<br>让空空的展缸，游满缤纷的生命。</p><div class="features"><span>潜水与珍藏</span><span>持续扩建</span><span>馆长荣誉</span></div><button id="start" class="primary">开门 · 去捕鱼 <b>↗</b></button><small>WASD / 方向键，或拖动摇杆移动</small></section>
<section id="drawer" class="card" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden><header><div><small id="drawer-sub">AQUA COAST</small><h2 id="drawer-title"></h2></div><button id="close" class="round" aria-label="关闭面板"></button></header><div id="drawer-content"></div></section>
<section id="inspect" class="card" hidden><button id="exit-inspect" class="round" aria-label="返回经营"></button><div><small>慢下来，看看它们</small><h2 id="inspect-title"></h2></div><span>拖动环顾 · 滚轮缩放</span></section>
<div id="loading"><span class="loader-fish">◈</span><strong>正在唤醒这片海…</strong></div><div id="pause-screen" class="card" hidden><h2>休息一下</h2><p>海洋馆已暂停，进度会自动保存。</p><button id="resume" class="primary">继续经营</button></div>
</main><script>addEventListener('error',e=>{console.error('Aqua Coast load error:',e.message,e.filename,e.lineno);const l=document.getElementById('loading');if(l&&!l.hidden)l.innerHTML='<strong>场景加载遇到问题</strong><span>请刷新页面后再试</span>';});addEventListener('unhandledrejection',e=>{console.error('Aqua Coast initialization:',e.reason);const l=document.getElementById('loading');if(l&&!l.hidden)l.innerHTML='<strong>场景加载遇到问题</strong><span>请刷新页面后再试</span>';});</script><script type="module" src="./src/app.mjs"></script></body></html>
