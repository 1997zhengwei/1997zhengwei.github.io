<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#82c9d0"><title>欢乐岛 · 游乐园大亨</title><link rel="stylesheet" href="./src/style.css"><link rel="icon" href="./assets/ui/sparkles.svg" type="image/svg+xml"></head><body>
<main id="game" aria-label="欢乐岛三维游乐园">
 <canvas id="scene" aria-label="可拖动浏览的三维游乐园" tabindex="0"></canvas>
 <div id="loading"><div class="loader-wheel"><i></i><i></i><i></i><i></i></div><h1>欢乐岛</h1><p>正在准备第一声欢呼…</p><div class="load-track"><span></span></div></div>
 <section id="park-hud" class="hud" hidden>
  <header class="topbar"><div class="brand panel"><div class="brand-mark">J<span>★</span></div><div><b>欢乐岛</b><small id="park-title">海边小乐园</small></div></div><div class="money panel"><img src="./assets/ui/coins.svg" alt=""><div><b id="cash">850</b><small>园区资金</small></div></div></header>
  <div class="stats"><span class="stat"><img src="./assets/ui/users.svg" alt=""><b id="guests">0</b><small>在园</small></span><span class="stat"><span class="heart">♥</span><b id="happy">88%</b><small>满意</small></span><span class="stat income-stat"><b id="income">0</b><small>累计营收</small></span></div>
  <button class="quest panel" id="quest" data-action="goal"><span class="quest-icon">★</span><span class="quest-copy"><small id="quest-detail">首个目标</small><b id="quest-title">第一声欢呼</b><span class="quest-track"><i id="quest-fill"></i></span></span><strong id="quest-count">0/8</strong></button>
  <aside class="toolbox" aria-label="园区设置"><button class="square blue" data-action="night" id="night" aria-label="切换夜景" title="日夜切换">☾</button><button class="square cream" data-action="sound" id="sound" aria-label="切换声音"><img src="./assets/ui/volume.svg" alt=""></button><button class="square cream" data-action="pause" id="pause" aria-label="暂停游戏"><img src="./assets/ui/player-pause.svg" alt=""></button><button class="square cream help-button" data-action="help" aria-label="玩法说明"><img src="./assets/ui/help.svg" alt=""></button></aside>
  <div id="world-labels"></div><div id="floats"></div>
  <div class="camera-tools"><button class="small cream" data-action="rotate-left" aria-label="向左旋转视角">↶</button><button class="small cream" data-action="zoom-in" aria-label="放大视角">＋</button><button class="small cream" data-action="zoom-out" aria-label="缩小视角">−</button><button class="small cream" data-action="rotate-right" aria-label="向右旋转视角">↷</button></div>
  <div id="selection" class="selection panel" hidden></div>
  <button id="quick-ride" class="quick-ride panel" data-action="ride" data-id="coaster"><span class="ticket-icon">01</span><span><small>园长专属 · 免费体验</small><b>坐一次逐浪飞龙</b></span><strong>出发 ↗</strong></button>
  <nav class="bottom-nav" aria-label="园区经营"><button class="nav-button yellow" data-action="facilities"><img src="./assets/ui/building-store.svg" alt=""><span>建造设施</span></button><button class="nav-button green" data-action="manage"><img src="./assets/ui/users.svg" alt=""><span>经营升级</span></button><button class="nav-button blue" data-action="overview"><img src="./assets/ui/map.svg" alt=""><span>园区全景</span></button></nav>
  <p class="hint" id="hint">拖动浏览 · 点设施管理 · 滚轮或双指缩放</p>
 </section>
 <section id="welcome" class="welcome" hidden><div class="welcome-card panel"><span class="eyebrow">WELCOME TO YOUR HAPPY PLACE</span><h1>把快乐，<br>建成一座岛。</h1><p>从一座旋转木马出发，<br>接待游客，把梦想中的乐园慢慢变大。</p><div class="welcome-features"><span>真实排队上客</span><span>八种设施试乘</span><span>昼夜海岛风景</span></div><button class="primary yellow" data-action="start">开门迎客 <span>→</span></button><button class="welcome-trial" data-action="start-ride">先坐一趟过山车 ↗</button></div></section>
 <section id="ride-hud" class="ride-hud" hidden><div class="ride-top"><button class="back-button cream ride-icon" data-action="exit-ride" aria-label="返回经营" title="返回经营"><img src="./assets/ui/ride-exit.svg" alt=""></button><span class="ride-mode" id="ride-mode">园长试乘 · 经营暂停</span></div><div class="ride-title"><span id="ride-tag">极速海岸</span><h1 id="ride-name">逐浪飞龙</h1><p id="ride-stage">请坐稳，列车即将出发</p></div><div class="ride-instruments"><div class="ride-instrument" title="速度"><img src="./assets/ui/ride-speed.svg" alt="速度"><strong id="ride-speed">0<em>km/h</em></strong></div><div class="ride-instrument" title="高度"><img src="./assets/ui/ride-height.svg" alt="高度"><strong id="ride-height">2<em>m</em></strong></div></div><div class="ride-bottom"><div class="ride-controls" id="ride-controls" role="group" aria-label="乘坐操作"><button class="ride-control cream ride-icon" data-action="ride-camera" id="ride-camera" aria-label="切换跟拍" aria-pressed="false" title="切换跟拍"><img src="./assets/ui/ride-camera.svg" alt=""></button><button class="ride-control yellow ride-icon main-action" data-action="cheer" id="cheer" aria-label="举起双手！" aria-pressed="false" title="举起双手"><img src="./assets/ui/ride-hands.svg" alt=""></button><button class="ride-control cream ride-icon is-active" data-action="comfort" id="comfort" hidden aria-label="镜头稳定" aria-pressed="true" title="切换为动感视角"><img src="./assets/ui/ride-stabilize.svg" alt=""></button></div><p id="ride-hint" class="ride-gesture"><img src="./assets/ui/ride-look.svg" alt="">拖动环顾</p></div><div id="ride-finish" class="ride-finish panel" hidden><img class="arrival-icon" src="./assets/ui/circle-check.svg" alt=""><h2>平稳到站</h2><div class="arrival-actions"><button class="arrival-action yellow" data-action="repeat-ride" aria-label="再坐一次" title="再坐一次"><img src="./assets/ui/ride-repeat.svg" alt=""><span>再玩一次</span></button><button class="arrival-action green" data-action="exit-ride" aria-label="返回我的乐园" title="返回我的乐园"><img src="./assets/ui/map.svg" alt=""><span>回乐园</span></button></div></div></section>
 <div id="shade" class="shade" hidden></div><section id="drawer" class="drawer panel" aria-modal="true" role="dialog" hidden><header><div><span class="eyebrow" id="drawer-subtitle"></span><h2 id="drawer-title"></h2></div><button class="square cream" data-action="close" aria-label="关闭面板"><img src="./assets/ui/x.svg" alt=""></button></header><div id="drawer-content"></div></section>
 <div id="toast" role="status" hidden></div><div id="paused" class="paused panel" hidden><b>乐园已暂停</b><button class="primary yellow" data-action="pause">继续营业</button></div><div id="fade"></div>
</main><script type="module" src="./src/app.mjs"></script></body></html>
