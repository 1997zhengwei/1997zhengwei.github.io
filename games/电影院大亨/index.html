<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174c81"><title>电影院大亨 · 星映影城</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./src/style.css"></head>
<body><main id="game" aria-label="电影院大亨三维游戏"><canvas id="scene" aria-label="可扩建和管理的三维电影院"></canvas>
<section id="welcome"><div class="welcome-art"></div><div class="welcome-card"><div class="eyebrow">BUILD YOUR CINEMA EMPIRE</div><div class="welcome-brand">✦</div><h1>星映影城</h1><h2>从第一张电影票，<br>经营你的影院帝国。</h2><p>接待观众 · 招募员工 · 升级影厅<br>让你的影院，从街角走向满座。</p><button id="start" class="gold" disabled>正在点亮放映灯…</button><small>WASD / 方向键 · 点击地面 · 手机摇杆</small></div></section>
<header id="hud" hidden><button id="brand" class="plaque" aria-label="查看影城荣誉"><span class="brand-icon" data-icon="film"></span><span><b>星映影城</b><small id="level">LV.1 · 一盏放映灯</small></span></button><button id="wallet" class="plaque" aria-label="查看影城账本"><span data-icon="coin"></span><span><b id="cash">180</b><small>影城金币</small></span></button></header>
<button id="objective" hidden><span class="objective-star" data-icon="star"></span><span><b id="quest-title"></b><small id="quest-hint"></small></span><strong id="quest-count"></strong></button>
<nav id="tools" hidden aria-label="视角与设置"><button id="sound" class="square" aria-label="开启声音" data-icon="mute"></button><button id="overview" class="square" aria-label="全局俯瞰" data-icon="map"></button><button id="pause" class="square" aria-label="暂停" data-icon="pause"></button><button id="help" class="square" aria-label="玩法说明" data-icon="help"></button></nav>
<div id="labels" aria-label="影城中的经营地点"></div><div id="player-marker" hidden>经理<span>▼</span></div><div id="floating" aria-hidden="true"></div>
<aside id="hint" hidden><span id="hint-icon" data-icon="ticket"></span><span><b id="hint-title"></b><small id="hint-detail"></small></span></aside>
<div id="cargo" hidden><span data-icon="popcorn"></span><b id="cargo-count">0 / 12</b><small>搬运中</small></div>
<div id="joystick" role="group" aria-label="拖动摇杆移动" hidden><div class="joy-outer"></div><div id="stick"></div></div>
<button id="action" class="gold" hidden><span id="action-icon" data-icon="ticket"></span><span id="action-text">接待观众</span></button>
<nav id="bottom" hidden aria-label="经营菜单"><button data-menu="estate"><span data-icon="build"></span><b>影厅 · 扩建</b></button><button data-menu="films"><span data-icon="film"></span><b>电影片库</b></button><button data-menu="team"><span data-icon="staff"></span><b>团队 · 设备</b></button></nav>
<section id="view" hidden><header><button id="leave-view" class="square" aria-label="返回经营" data-icon="back"></button><span><small id="view-hall"></small><h2 id="view-title"></h2><b id="view-state"></b></span><span id="view-audience"></span></header><div class="view-badge">DIRECTOR’S LOUNGE</div><footer><button id="view-seat" class="mint" aria-label="切换座位"><span data-icon="seat"></span><small>换座</small></button><button id="view-cheer" class="gold" aria-label="鼓掌应援"><span data-icon="star"></span><small>鼓掌应援</small></button><button id="view-camera" class="cream" aria-label="切换影厅视角"><span data-icon="camera"></span><small>全景</small></button></footer><small class="view-tip">拖动环顾 · 每场可应援一次 · 随时返回经营</small></section>
<div id="scrim" hidden><section id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header><span><small id="drawer-kicker"></small><h2 id="drawer-title"></h2></span><button id="close" class="square" aria-label="关闭面板" data-icon="close"></button></header><div id="drawer-content"></div></section></div>
<div id="toast" role="status" hidden></div><div id="celebration" role="dialog" aria-modal="true" aria-labelledby="celebration-title" hidden><div><span id="celebration-icon" data-icon="trophy"></span><small>THE CITY KNOWS YOUR NAME</small><h2 id="celebration-title"></h2><p id="celebration-detail"></p><button id="celebration-close" class="gold">继续造梦</button></div></div><div id="fade" aria-hidden="true"></div>
</main><script type="module" src="./src/app.mjs"></script></body></html>
