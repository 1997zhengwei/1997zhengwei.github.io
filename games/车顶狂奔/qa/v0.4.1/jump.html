<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车顶狂奔 · 新跳跃姿态预览</title><style>body{margin:0;overflow:hidden;font:12px system-ui;background:#eae6da;color:#2b3e47}canvas{display:block}header{position:fixed;left:24px;top:20px}header b{display:block;font-size:18px;margin-bottom:6px}nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:8px;background:#fbf7edee;white-space:nowrap}button{border:0;border-radius:4px;padding:10px 14px;background:#dedfd5;color:#304950;font:inherit;cursor:pointer}button.selected{background:#e96639;color:#fff}</style></head><body><header><b>新跳跃姿态 · 动作预览</b>双膝向前、前后错位收腿；这是姿态样本，不模拟通关。</header><nav><button data-phase="0">起跳</button><button data-phase=".22">上升</button><button data-phase=".5" class="selected">腾空</button><button data-phase=".8">下落</button><button data-phase=".999">落地准备</button><button id="turn">转动视角 ↻</button></nav><script type="module">
import * as T from '../../vendor/three.module.js';
import {createCourier} from '../../src/courier.mjs';
import {createAthleticJump} from '../../src/jump-pose.mjs';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#eae6da');const camera=new T.PerspectiveCamera(36,1,.1,50);scene.add(new T.HemisphereLight('#d9efff','#a29b80',2.0));const light=new T.DirectionalLight('#fff7df',3.8);light.position.set(3,5,4);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:'#d8d5c7',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const c=createCourier(await fetch('../../assets/courier-rig.json').then(r=>r.json())),clip=createAthleticJump(c.root,c.bones),mixer=new T.AnimationMixer(c.root),action=mixer.clipAction(clip).play();action.paused=true;action.time=.5;mixer.update(0);scene.add(c.root);let angle=.95;
function render(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.set(Math.sin(angle)*3.4,1.5,Math.cos(angle)*3.4);camera.lookAt(0,1,0);camera.updateProjectionMatrix();renderer.render(scene,camera);}
for(const button of document.querySelectorAll('[data-phase]'))button.addEventListener('click',()=>{document.querySelector('.selected')?.classList.remove('selected');button.classList.add('selected');action.time=Number(button.dataset.phase);mixer.update(0);render();});document.querySelector('#turn').addEventListener('click',()=>{angle+=.7;render();});window.addEventListener('resize',render);render();
</script></body></html>
