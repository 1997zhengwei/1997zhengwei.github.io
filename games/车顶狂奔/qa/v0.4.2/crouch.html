<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车顶狂奔 · 下蹲提示样本</title><link rel="stylesheet" href="../../src/style.css"><style>body{background:#80a9b9}.qa-panel{position:fixed;left:24px;top:175px;z-index:60;background:#f9f4e6;padding:18px;border-radius:8px;font-size:12px}.qa-panel p{font-size:10px;color:#637b7d}.qa-panel button{padding:10px;margin-right:5px;border-radius:4px;background:#dddfd1}</style><div id="ui" data-controls="touch"></div><section class="qa-panel"><b>下蹲显示条件 · UI 状态样本</b><p>仅检查按钮和提示，不模拟比赛或写入成绩。</p><button data-case="far">普通路段</button><button data-case="near">接近限高架</button><button data-case="past">通过限高架后</button></section><script type="module">
import {Game} from '../../src/simulation.mjs';import {makeCourse} from '../../src/courses.mjs';import {UI} from '../../src/ui.mjs';
const game=new Game(makeCourse(2,0)),ui=new UI(document.querySelector('#ui'),{}, {runs:{},sound:false}),gate=game.course.gates[0];ui.hud(game.course);function show(kind){game.player.s=kind==='near'?gate.s-60:kind==='past'?gate.s+10:game.startS;game.player.x=gate.x;game.player.maxS=game.player.s;ui.update(game,'first',0);}for(const b of document.querySelectorAll('[data-case]'))b.addEventListener('click',()=>show(b.dataset.case));show('far');
</script></html>
