<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff4d7"><title>迷你生鲜大亨 · FRESH MART</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='51' font-size='52'%3E🍅%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./src/style.css"></head><body>
<canvas id="game" aria-label="三维生鲜超市，点击地面移动"></canvas>
<div id="hud">
 <header><div class="brand"><span class="brand-icon">🍅</span><div><b>迷你生鲜</b><small id="title">街角新店</small></div></div><button id="wallet" aria-label="领取营业款"><i>●</i><b id="money">35</b><small id="pending">营业款 0</small></button></header>
 <button id="goal"><span id="goal-tag">开店第一步</span><strong id="goal-text">采收 6 个番茄</strong><span id="goal-detail">点击前往，停下自动采收 →</span><span class="goal-track"><span id="goal-progress"></span></span></button>
 <div class="tools"><button id="overview" title="全店视角 Q" aria-label="全店视角">▦</button><button id="empire" aria-label="商业地图">🗺</button><button id="help" aria-label="玩法说明">?</button><button id="sound" aria-label="切换音效">♪</button><button id="pause" aria-label="暂停游戏">Ⅱ</button></div>
 <div id="player-pin" hidden aria-hidden="true">我</div>
 <div id="world-labels" aria-hidden="true"></div>
 <div id="toast" role="status"></div>
 <div id="bottom"><div id="bag"><span class="bag-title">搬运货堆 <b id="bag-count">0 / 6</b></span><span id="bag-items">空篮子，去田里采收吧</span><button id="select-product">🍅 番茄 ▾</button></div><div class="controls"><div id="stick" role="button" aria-label="移动摇杆"><span class="stick-arrows">＋</span><div id="stick-thumb"></div></div><div class="commands"><button id="harvest"><span>🍅</span><b>采收</b></button><button id="restock"><span>📦</span><b>补货</b></button><button id="checkout"><span>▣</span><b>收银</b></button></div></div><button id="manage">✦ 经营 · 装扮 · 门店 <span>›</span></button><small id="desktop-tip">WASD / 方向键移动 · 点击地面前往 · E 管理 · Q 全景</small></div>
 <div id="route" hidden><span></span><button aria-label="取消自动前往">×</button></div>
</div>
<div id="intro" class="overlay"><section class="welcome"><span class="eyebrow">FARM FRESH · EVERY DAY</span><h1>迷你生鲜<span>大亨</span></h1><p>从一篮番茄开始，<br>把街角小店经营成热闹的生鲜超市。</p><div class="welcome-steps"><span>🍅<small>采收</small></span><i>›</i><span>📦<small>补货</small></span><i>›</i><span>🛒<small>售卖</small></span><i>›</i><span>💰<small>扩建</small></span></div><button id="start" class="primary">开门营业 <span>→</span></button><small>靠近工作区，停下就会自动操作</small></section></div>
<div id="sheet-overlay" class="overlay" hidden><section id="sheet" role="dialog" aria-modal="true" aria-label="超市管理"><div class="sheet-head"><div><span class="eyebrow">YOUR LITTLE EMPIRE</span><h2 id="sheet-title">经营小店</h2></div><button id="close-sheet" aria-label="关闭面板">×</button></div><nav id="tabs"><button data-tab="goods" class="active">商品工坊</button><button data-tab="staff">雇用员工</button><button data-tab="owner">店长升级</button><button data-tab="wardrobe">装扮工坊</button><button data-tab="growth">门店成长</button><button data-tab="map">商业地图</button></nav><div id="sheet-content"></div><footer id="sheet-footer">营业已暂停 · 关闭面板继续经营</footer></section></div>
<div id="pause-overlay" class="overlay" hidden><section class="welcome compact"><span class="eyebrow">TAKE A LITTLE BREAK</span><h2>小店休息中</h2><p>进度已保存在此浏览器</p><button id="resume" class="primary">继续营业 →</button></section></div>
<div id="fatal" hidden>画面加载遇到问题，请重新加载。<button onclick="location.reload()">重新加载</button></div><script type="module" src="./src/app.mjs"></script></body></html>
